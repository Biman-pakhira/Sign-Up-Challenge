<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="heading">
            <h1>SignUp</h1>
        </div>
        <div class="form">
            <form>
                <input type="text" name="" class="forminputs" placeholder="Full Name">
                <input type="email" class="forminputs" placeholder="Email">
                <input type="password" class="forminputs" placeholder="Password">
                <input type="password" class="forminputs" placeholder="Confirm Password">
                <input type="date" class="forminputs">
                <div class="occupationn">
                    <div class="student">
                        <input type="radio" name="occupaton" id="student"><label for="student"> Student</label>
                    </div>
                    <div class="employee">
                        <input type="radio" name="occupaton" id="employee"><label for="employee"> Employee</label>
                    </div>
                </div>
                <div class="confirm">
                    <input type="checkbox" class="forminput" id="chkbx"><label for="chkbx">  I agree to all the Terms and conditions</label>
                </div>
                <button type="submit">Signup</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
